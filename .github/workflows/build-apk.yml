name: Build & Publish BUGTI EDITZ APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bugti-editz-latest-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Latest APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install SDK 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMGR="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --sdk_root="$SDK_ROOT" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36.1" || \
            "$SDKMGR" --sdk_root="$SDK_ROOT" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists
        run: |
          if [ ! -s debug.keystore ]; then
            if [ -s debug.keystore.base64 ]; then
              base64 -di debug.keystore.base64 > debug.keystore || rm -f debug.keystore
            fi
            if [ ! -s debug.keystore ]; then
              keytool -genkeypair -noprompt -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build BUGTI EDITZ APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2

      - name: Export APK to Download folder and stage release asset
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p Download
          cp app/build/outputs/apk/debug/app-debug.apk Bugti-Editz.apk
          cp app/build/outputs/apk/debug/app-debug.apk Download/Bugti-Editz.apk
          ls -lh Bugti-Editz.apk Download/Bugti-Editz.apk

      - name: Upload workflow build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bugti-Editz-APK
          path: Bugti-Editz.apk
          retention-days: 30

      - name: Update rolling latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push -f origin "${{ github.sha }}:refs/tags/latest" || true

      - name: Publish APK to permanent Latest GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "BUGTI EDITZ — Latest APK"
          body: |
            Automated BUGTI EDITZ build from commit `${{ github.sha }}` (Run #${{ github.run_number }}).

            Direct APK Download: https://github.com/${{ github.repository }}/releases/latest/download/Bugti-Editz.apk
          files: Bugti-Editz.apk
          overwrite_files: true
          make_latest: true
          draft: false
          prerelease: false

      - name: Commit Download/Bugti-Editz.apk and download links to branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Bugti-Editz.apk"
          RAW_APK_URL="https://github.com/${GITHUB_REPOSITORY}/raw/${GITHUB_REF_NAME}/Download/Bugti-Editz.apk"

          printf '%s\n' \
            '# Bugti Editz — APK Download' \
            '' \
            "- **Latest Release Direct APK:** [${RELEASE_URL}](${RELEASE_URL})" \
            "- **Download Folder APK File:** [${RAW_APK_URL}](${RAW_APK_URL})" \
            "- **HTML Download Page:** [Download/index.html](./index.html)" > Download/README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Download/Bugti-Editz.apk Download/README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish Download/Bugti-Editz.apk [skip ci]"
            git fetch origin "${GITHUB_REF_NAME}" --depth=1 || true
            git rebase "origin/${GITHUB_REF_NAME}" || true
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
